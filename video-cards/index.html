<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Score OS — The Arsenal · Video cards (preview)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,400;0,9..144,500;1,9..144,340&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #f4f6fa; overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  #section { position: fixed; inset: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color: var(--ink);
    --ink: #12141a; --ink-2: #565c6b; --ink-3: #9198a6;
    --line: rgba(18,20,26,.14); --line-2: rgba(18,20,26,.07);
    --accent: #025D25;
    --accent-gold: #FCC325;
    --corner: 16px; --hover: 1.05; --scrim: .9; --shadow: 1;
    --title-size: 17px; --title-color: #ffffff;
    --bg-top: #ffffff; --bg-bottom: #e9edf4;
  }

  #stage { position: fixed; inset: 0; overflow: hidden;
    background: radial-gradient(125% 95% at 50% 4%, var(--bg-top) 0%, var(--bg-bottom) 100%);
    perspective: 1200px; perspective-origin: 50% 50%;
    display: grid; place-items: center;
    cursor: grab; touch-action: none; user-select: none; outline: none; }
  #stage.-drag { cursor: grabbing; }
  #stage.-locked { pointer-events: none; }

  #floor { position: absolute; left: 50%; top: 68%; width: 62vw; height: 26vh; z-index: 0;
    transform: translate(-50%,-50%);
    background: radial-gradient(60% 60% at 50% 50%, rgba(18,20,26,.14), rgba(18,20,26,0) 70%);
    filter: blur(6px); pointer-events: none; }
  #ghost { position: absolute; left: 50%; top: 51%; z-index: 0; transform: translate(-50%,-50%);
    font-family: 'Fraunces', Georgia, serif; font-weight: 400; font-size: 42vh; line-height: .8;
    color: rgba(18,20,26,.045); letter-spacing: -.03em; pointer-events: none; user-select: none;
    font-variant-numeric: tabular-nums; }

  #ring { position: relative; width: 0; height: 0; transform-style: preserve-3d; z-index: 1;
    transform: translateY(var(--lift, 0px)) translateZ(var(--push, 0px)) rotateY(var(--rot, 0deg)); }

  .card { position: absolute; width: var(--cw, 220px); height: var(--ch, 300px);
    left: calc(var(--cw, 220px) / -2); top: calc(var(--ch, 300px) / -2);
    transform: rotateY(var(--a)) translateZ(calc(var(--r, 620px) * var(--zsign, -1) - var(--zb, 0px))) scale(var(--s, 1));
    backface-visibility: hidden; -webkit-backface-visibility: hidden; transform-style: preserve-3d; }
  .card__inner {
    position: absolute; inset: 0; border-radius: var(--corner); overflow: hidden; background: #0a0e18;
    box-shadow: 0 26px 60px -18px rgba(24,34,64, calc(.42 * var(--shadow))),
                0 6px 16px -8px rgba(24,34,64, calc(.32 * var(--shadow)));
    transition: transform .4s cubic-bezier(.22,.61,.36,1), box-shadow .4s ease;
    backface-visibility: hidden; -webkit-backface-visibility: hidden; will-change: transform; }
  .card.-front { z-index: 5; }
  .card.-front .card__inner { box-shadow: 0 40px 90px -20px rgba(24,34,64,.5), 0 8px 22px -8px rgba(24,34,64,.4); }
  .card:hover .card__inner { transform: scale(var(--hover)); }
  .card__inner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .card__scrim { position: absolute; inset: 0; pointer-events: none; opacity: var(--scrim);
    background: linear-gradient(to top, rgba(6,10,22,.85) 0%, rgba(6,10,22,.28) 30%, rgba(6,10,22,0) 55%); }
  .card__no { position: absolute; top: 12px; left: 13px; z-index: 2; font-size: 11px; font-weight: 600;
    letter-spacing: .12em; color: rgba(255,255,255,.92); font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 8px rgba(0,0,0,.4); }
  .card__foot { position: absolute; left: 14px; right: 14px; bottom: 12px; z-index: 2; }
  .card__title { margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 400;
    font-size: var(--title-size); line-height: 1.05; letter-spacing: -.01em;
    color: var(--title-color); text-shadow: 0 1px 10px rgba(0,0,0,.35); }

  #frame { position: fixed; inset: 16px; z-index: 3; pointer-events: none;
    border: 1px solid var(--line-2); border-radius: 6px; }
  #frame i { position: absolute; width: 9px; height: 9px; }
  #frame i::before, #frame i::after { content: ''; position: absolute; background: var(--line); }
  #frame i::before { left: 0; top: 0; width: 9px; height: 1px; }
  #frame i::after  { left: 0; top: 0; width: 1px; height: 9px; }
  #frame .tl { left: -1px; top: -1px; }
  #frame .tr { right: -1px; top: -1px; transform: scaleX(-1); }
  #frame .bl { left: -1px; bottom: -1px; transform: scaleY(-1); }
  #frame .br { right: -1px; bottom: -1px; transform: scale(-1); }

  #top { position: fixed; top: 0; left: 0; right: 0; z-index: 6;
    display: flex; align-items: center; justify-content: space-between;
    padding: clamp(14px, 2.4vh, 28px) clamp(20px, 3.6vw, 48px); gap: 16px; }
  #brand { display: flex; align-items: center; gap: 0; line-height: 0; }
  #brand a { display: flex; align-items: center; text-decoration: none; }
  #brand img {
    height: 60px; width: auto; display: block;
    /* crisp on light bg — no blend halo */
    background: transparent;
  }
  @media (max-width: 760px) {
    #brand img { height: 48px; }
  }
  @media (min-width: 761px) and (max-width: 1100px) {
    #brand img { height: 56px; }
  }
  #nav { display: flex; gap: clamp(18px, 2.6vw, 38px); }
  #nav a { color: var(--ink-2); text-decoration: none; font-size: 14px; font-weight: 500; letter-spacing: .01em;
    position: relative; transition: color .2s; }
  #nav a::after { content: ''; position: absolute; left: 0; right: 100%; bottom: -5px; height: 1px;
    background: var(--ink); transition: right .28s cubic-bezier(.22,.61,.36,1); }
  #nav a:hover, #nav a:focus-visible { color: var(--ink); }
  #nav a:hover::after, #nav a:focus-visible::after { right: 0; }
  #cta { display: inline-flex; align-items: center; gap: 8px; padding: 9px 17px; border-radius: 999px;
    background: var(--ink); color: #fff; font-size: 13px; font-weight: 500; letter-spacing: .01em;
    text-decoration: none; border: 1px solid var(--ink); transition: transform .2s ease, background .2s ease; white-space: nowrap; }
  #cta:hover { transform: translateY(-1px); background: #000; }
  #cta .arw { transition: transform .25s ease; }
  #cta:hover .arw { transform: translateX(3px); }

  #mast { position: fixed; top: clamp(80px, 13vh, 128px); left: 0; right: 0; z-index: 4;
    text-align: center; pointer-events: none; padding: 0 20px; }
  #eyebrow { display: inline-flex; align-items: center; gap: 9px; font-size: 11px; font-weight: 600;
    letter-spacing: .26em; text-transform: uppercase; color: var(--ink-3); }
  #eyebrow::before, #eyebrow::after { content: ''; width: 26px; height: 1px; background: var(--line); }
  #headline { margin: 14px 0 0; font-family: 'Fraunces', Georgia, serif; font-weight: 340;
    font-size: clamp(28px, 4.6vw, 58px); line-height: 1.02; letter-spacing: -.018em; color: var(--ink);
    text-wrap: balance; }
  #headline em { font-style: italic; font-weight: 400; }

  .edge { position: fixed; top: 50%; z-index: 4; font-size: 10.5px; font-weight: 600; letter-spacing: .28em;
    text-transform: uppercase; color: var(--ink-3); pointer-events: none; white-space: nowrap; }
  .edge.-l { left: clamp(22px, 3.4vw, 40px); transform: translateY(-50%) rotate(-90deg); transform-origin: left center; }
  .edge.-r { right: clamp(22px, 3.4vw, 40px); transform: translateY(-50%) rotate(90deg); transform-origin: right center; }

  #dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 24px;
    padding: 0 clamp(24px, 4vw, 56px) clamp(22px, 4vh, 40px); pointer-events: none; }
  #dock > * { pointer-events: auto; }
  .dock__count { font-variant-numeric: tabular-nums; letter-spacing: .04em; font-size: 13px; color: var(--ink-3); }
  .dock__count b { font-size: 34px; font-weight: 500; color: var(--ink); font-family: 'Fraunces', serif; letter-spacing: 0; }
  .dock__count i { font-style: normal; }

  .dock__c { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .dock__title { margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 400;
    font-size: clamp(22px, 2.8vw, 34px); line-height: 1; letter-spacing: -.01em; color: var(--ink); }
  .dock__sub { display: flex; align-items: center; gap: 14px; font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
  .dock__rating { display: inline-flex; align-items: center; gap: 4px; color: var(--ink); }
  .dock__rating svg { width: 13px; height: 13px; color: var(--accent); }
  .dock__pip { width: 3px; height: 3px; border-radius: 50%; background: var(--line); }
  #dots { display: flex; align-items: center; gap: 7px; }
  #dots button { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--line); transition: width .3s cubic-bezier(.22,.61,.36,1), background .3s ease; }
  #dots button.-on { width: 24px; background: var(--accent); }

  .dock__r { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
  .navbtn { width: 48px; height: 48px; border-radius: 999px; border: 1px solid var(--line);
    background: rgba(255,255,255,.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    color: var(--ink); font-size: 19px; line-height: 1; cursor: pointer; display: grid; place-items: center;
    transition: background .2s ease, color .2s ease, border-color .2s ease, transform .15s ease; }
  .navbtn:hover { background: var(--ink); color: #fff; border-color: var(--ink); }
  .navbtn:active { transform: scale(.94); }

  /* Sit in the gap between card bottom and dock title — not under the center card. */
  .hint { position: fixed; left: 50%; bottom: clamp(108px, 13.5vh, 128px); transform: translateX(-50%); z-index: 4;
    font-size: 10.5px; letter-spacing: .3em; text-transform: uppercase; font-weight: 600; color: var(--ink-3);
    pointer-events: none; user-select: none; opacity: .9; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

  @media (max-width: 1024px) {
    #ghost { font-size: 34vh; }
    .edge { display: none; }
  }
  @media (max-width: 760px) {
    #nav { display: none; }
    #cta { padding: 8px 13px; }
    #frame { inset: 10px; }
    #mast { top: clamp(68px, 9.5vh, 96px); }
    #headline { font-size: clamp(24px, 6.2vw, 34px); margin-top: 10px; }
    /* Center column must shrink so prev/next stay inside the viewport (20 dots used to shove › off-screen at 430). */
    #dock { grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center;
      padding: 0 16px clamp(16px, 2.6vh, 26px); }
    .dock__count b { font-size: 24px; }
    .dock__count i, .dock__count .of { display: none; }
    .dock__c { gap: 9px; min-width: 0; overflow: hidden; }
    .dock__title { font-size: clamp(18px, 4.6vw, 26px); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dock__sub { max-width: 100%; overflow: hidden; }
    .dock__r { flex-shrink: 0; gap: 8px; }
    .hint { display: none; }
    .navbtn { width: 40px; height: 40px; flex-shrink: 0; }
    #dots { display: none; } /* dots wider than phone column; swipe + arrows cover nav */
    /* Larger face: keep labels clear, curb hover blow-up into chrome */
    #section { --corner: 18px; --hover: 1.03; --title-size: 18px; }
    .card__no { top: 14px; left: 15px; font-size: 12px; }
    .card__foot { left: 16px; right: 16px; bottom: 14px; }
  }
  @media (max-width: 420px) {
    .dock__sub { font-size: 11.5px; gap: 10px; }
    .navbtn { width: 38px; height: 38px; }
    #dock { gap: 8px; padding-left: 12px; padding-right: 12px; }
  }
  @media (max-height: 560px) {
    #mast { top: 60px; }
    #headline { font-size: clamp(22px, 5vw, 34px); }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card__inner, #dots button, #nav a::after, #detail-panel, #detail-backdrop, #detail-fly { transition: none !important; }
  }


  #site-disclaimer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7;
    padding: 6px clamp(12px, 3vw, 28px) max(6px, env(safe-area-inset-bottom));
    pointer-events: none; text-align: center;
    background: linear-gradient(180deg, transparent, rgba(247,248,250,.92) 40%); }
  #site-disclaimer p { margin: 0 auto; max-width: 920px; font-size: 9.5px; line-height: 1.35;
    letter-spacing: .02em; color: var(--ink-3); font-weight: 500; }
  @media (max-width: 760px) {
    #site-disclaimer p { font-size: 8.5px; }
    #dock { padding-bottom: calc(clamp(16px, 2.6vh, 26px) + 22px); }
  }
  @media (min-width: 761px) {
    #dock { padding-bottom: calc(clamp(22px, 4vh, 40px) + 18px); }
  }

  .dock__rating .tag-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; }
  #preview-badge { position: fixed; top: 8px; right: 12px; z-index: 20; font-size: 9px; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3);
    background: rgba(255,255,255,.72); border: 1px solid var(--line-2); border-radius: 999px;
    padding: 4px 9px; pointer-events: none; backdrop-filter: blur(4px); }

  /* ---------- detail view ---------- */
  #detail { position: fixed; inset: 0; z-index: 40; display: none;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  #detail.-open { display: block; }
  #detail-backdrop { position: absolute; inset: 0; background: rgba(18,20,26,.42);
    opacity: 0; transition: opacity .45s ease; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #detail.-open #detail-backdrop { opacity: 1; }
  #detail-fly { position: fixed; z-index: 41; border-radius: var(--corner); overflow: hidden;
    background: #0a0e18; pointer-events: none;
    box-shadow: 0 40px 90px -20px rgba(24,34,64,.5), 0 8px 22px -8px rgba(24,34,64,.4);
    transition: transform .45s cubic-bezier(.22,.61,.36,1), width .45s cubic-bezier(.22,.61,.36,1), height .45s cubic-bezier(.22,.61,.36,1), left .45s cubic-bezier(.22,.61,.36,1), top .45s cubic-bezier(.22,.61,.36,1), border-radius .45s ease;
    will-change: left, top, width, height; }
  #detail-fly img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #detail-panel { position: absolute; inset: 0; z-index: 42; display: flex; align-items: center; justify-content: center;
    padding: clamp(16px, 4vw, 48px); opacity: 0; transform: translateY(12px);
    transition: opacity .35s ease .12s, transform .35s ease .12s; pointer-events: none; }
  #detail.-ready #detail-panel { opacity: 1; transform: none; }
  #detail.-ready #detail-sheet,
  #detail.-ready #detail-close { pointer-events: auto; }
  #detail-sheet { width: min(920px, 100%); max-height: min(92vh, 860px); display: grid;
    grid-template-columns: minmax(220px, 38%) 1fr; gap: 0; background: #fff;
    border-radius: calc(var(--corner) + 4px); overflow: hidden;
    box-shadow: 0 40px 90px -20px rgba(24,34,64,.45), 0 8px 22px -8px rgba(24,34,64,.28);
    border: 1px solid var(--line-2); }
  #detail-media { position: relative; min-height: 280px; background: #0a0e18; }
  #detail-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #detail-body { padding: clamp(22px, 3.4vw, 40px); display: flex; flex-direction: column; gap: 16px; overflow: auto;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif !important;
    font-synthesis: none; }
  #detail-body p, #detail-body li, #detail-body a, #detail-body div {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif !important; }
  #detail-title { font-family: 'Fraunces', Georgia, serif !important; }
  #detail-kicker { font-size: 11px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-3);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  #detail-title { margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 400;
    font-size: clamp(28px, 3.6vw, 42px); line-height: 1.05; letter-spacing: -.02em; color: var(--ink); }
  #detail-blurb { margin: 0; font-size: 15px; line-height: 1.55; color: var(--ink-2);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  #detail-steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  #detail-steps li { display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: start;
    font-size: 13.5px; line-height: 1.4; color: var(--ink); font-weight: 500;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  #detail-steps .n { font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    color: var(--accent); padding-top: 2px; }
  #detail-bullets { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  #detail-bullets li { position: relative; padding-left: 18px; font-size: 14px; line-height: 1.4; color: var(--ink); font-weight: 500;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  #detail-bullets li::before { content: ''; position: absolute; left: 0; top: .55em; width: 7px; height: 7px;
    border-radius: 50%; background: var(--accent); }
  #detail-actions { margin-top: auto; display: flex; align-items: center; gap: 12px; padding-top: 8px; }
  #detail-learn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 999px;
    background: var(--ink); color: #fff; font-size: 13px; font-weight: 500; text-decoration: none;
    border: 1px solid var(--ink); transition: transform .2s ease, background .2s; }
  #detail-learn:hover { transform: translateY(-1px); background: #000; }
  #detail-close { position: absolute; top: clamp(12px, 2.4vw, 22px); right: clamp(12px, 2.4vw, 22px); z-index: 43;
    width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--line);
    background: rgba(255,255,255,.88); backdrop-filter: blur(6px); color: var(--ink); font-size: 22px;
    cursor: pointer; display: grid; place-items: center; }
  #detail-close:hover { background: var(--ink); color: #fff; border-color: var(--ink); }
  #detail-handle { display: none; width: 42px; height: 4px; border-radius: 999px; background: var(--line);
    margin: 0 auto 10px; }

  @media (max-width: 760px) {
    #detail-panel { padding: 0; align-items: stretch; }
    #detail-sheet { width: 100%; max-height: 100%; height: 100%; border-radius: 0; grid-template-columns: 1fr;
      grid-template-rows: minmax(38vh, 42vh) 1fr; }
    #detail-media { min-height: 0; }
    #detail-body { padding: 22px 20px 28px; }
    #detail-handle { display: block; }
    #detail-close { top: 14px; right: 14px; }
  }

  /* ---------- video cards ---------- */
  .card__media { position: absolute; inset: 0; }
  .card__media img, .card__media video {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
    border: 0; outline: none; box-shadow: none;
    /* kill subpixel video/img compositor seams on 3D cards */
    transform: translateZ(0.01px);
    -webkit-clip-path: inset(0 round var(--corner));
    clip-path: inset(0 round var(--corner));
  }
  /* Soften hard vertical edges on recessed neighbors (mobile seam at ~x=345) */
  .card:not(.-front) .card__inner {
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 7px, #000 calc(100% - 7px), transparent 100%);
    mask-image: linear-gradient(to right, transparent 0, #000 7px, #000 calc(100% - 7px), transparent 100%);
    box-shadow: 0 18px 44px -22px rgba(24,34,64, calc(.30 * var(--shadow))),
                0 4px 12px -8px rgba(24,34,64, calc(.22 * var(--shadow)));
  }
  .card.-front .card__inner {
    -webkit-mask-image: none;
    mask-image: none;
  }
  .card__media video { opacity: 0; transition: opacity .35s ease; }
  .card.-front .card__media video.-on { opacity: 1; }
  .card.-front .card__media img.-dim { opacity: 0; transition: opacity .35s ease; }

  #detail-media video {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
    background: #0a0e18;
  }
  #detail-media img.poster-fallback {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  }
  #vid-ctrl {
    position: absolute; left: 12px; bottom: 12px; z-index: 3;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.22);
    background: rgba(10,14,24,.55); color: #fff; font-size: 12px; font-weight: 600;
    letter-spacing: .04em; cursor: pointer; backdrop-filter: blur(6px);
    font-family: 'Inter', system-ui, sans-serif;
  }
  #vid-ctrl:hover { background: rgba(10,14,24,.78); }
  #vid-ctrl[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="section">
  <div id="preview-badge">Preview only</div>
  <div id="stage" tabindex="0" role="region" aria-label="Spotlight gallery — draggable 3D carousel. Use left and right arrow keys to move between works. Tap the front card to open details.">
    <div id="floor"></div>
    <div id="ghost">01</div>

function clipBase(cd) {

function buildRing() {

function layout() {
  const vw = innerWidth;
  const vh = innerHeight;
  /* Phones/tablet: convex ring (zsign=+1) so center is closest; sides recede with a clear gap.
     Desktop keeps the original concave Colosseum arc. */
  let cw, radiusK, arcDepth, persp, zsign, push;
  if (vw <= 520) {
    cw = Math.min(310, Math.max(255, vw * 0.74)) * CFG.cardScale;
    radiusK = 3.25;
    arcDepth = 0.28;
    persp = Math.max(1100, vw * 1.4);
    zsign = 1;
  } else if (vw <= 900) {
    cw = Math.min(295, Math.max(248, vw * 0.38)) * CFG.cardScale;
    radiusK = 3.2;
    arcDepth = 0.50;
    persp = Math.max(1000, vw * 1.1);
    zsign = 1;
  } else {
    /* Desktop: slightly tighter so hint clears card bottom; keep ≥32px under headline. */
    cw = Math.min(355, Math.max(300, vw * 0.245)) * CFG.cardScale;
    radiusK = 2.55;
    arcDepth = 0.36;
    persp = Math.max(1200, vw * 1.05 * CFG.perspective);
    zsign = -1;
  }
  let ch = cw * CFG.cardRatio;
  const mastReserve = vw > 900
    ? Math.min(210, Math.max(150, vh * 0.26))
    : Math.min(168, Math.max(120, vh * 0.22));
  const dockReserve = Math.min(150, Math.max(110, vh * 0.17));
  const maxCh = Math.max(260, vh - mastReserve - dockReserve - 16);
  if (ch > maxCh) {
    ch = maxCh;
    cw = ch / CFG.cardRatio;
  }
  const r = cw * radiusK;
  push = zsign < 0 ? r * (1 - arcDepth) : -r * (1 + arcDepth);
  stage.style.setProperty('--cw', cw + 'px');
  stage.style.setProperty('--ch', ch + 'px');
  stage.style.setProperty('--r', r + 'px');
  stage.style.setProperty('--zsign', String(zsign));
  stage.style.setProperty('--push', push + 'px');
  stage.style.perspective = persp + 'px';
  const titlePx = Math.max(15, Math.min(22, cw * 0.078));
  document.getElementById('section').style.setProperty('--title-size', titlePx + 'px');
  /* Phones: nudge up. Desktop: drop the ring so the center card clears the headline by ≥32px. */
  let lift;
  if (vw <= 520) lift = Math.min(-12, Math.max(-28, -vh * 0.028));
  else if (vw <= 900) lift = -4;
  /* Slightly less drop than before so a smaller card still holds ~55px under the headline. */
  else lift = Math.round(Math.min(92, Math.max(76, vh * 0.098)));
  stage.style.setProperty('--lift', lift + 'px');
}

let rot = 0, vel = 0, dragging = false, lastX = 0, downX = 0, moved = false, targetIndex = 0, settled = true, lastRot = NaN;

const applyRot = () => { if (rot !== lastRot) { ring.style.setProperty('--rot', rot+'deg'); lastRot = rot } };
const frontSlot = () => ((Math.round(-rot / stepDeg()) % CFG.slots) + CFG.slots) % CFG.slots;
const nearestCenter = () => Math.round(-rot / stepDeg());

function go(delta) { if (detailOpen) return; targetIndex = nearestCenter() + delta; settled = true; vel = 0 }
function focusSlot(slot) {
  if (detailOpen) return;
  const cs = nearestCenter(); let d = ((slot - (cs % CFG.slots)) % CFG.slots + CFG.slots) % CFG.slots;
  if (d > CFG.slots / 2) d -= CFG.slots;
  targetIndex = cs + d; settled = true; vel = 0;
}
function focusWork(i) {
  if (detailOpen) return;
  const cs = nearestCenter(); let d = ((i - (cs % CARDS.length)) % CARDS.length + CARDS.length) % CARDS.length;
  if (d > CARDS.length / 2) d -= CARDS.length;
  targetIndex = cs + d; settled = true; vel = 0;
}

function ensureCardVideo(cardEl) {
  if (!cardEl) return null;
  const vid = cardEl.querySelector('video');
  if (!vid) return null;
  if (!vid.dataset.ready) {
    const webm = vid.dataset.srcWebm;
    const mp4 = vid.dataset.srcMp4;
    vid.poster = vid.dataset.poster || '';
    // Prefer webm then mp4
    vid.querySelectorAll('source').forEach(s => s.remove());
    if (webm) {
      const s = document.createElement('source'); s.src = webm; s.type = 'video/webm'; vid.appendChild(s);
    }
    if (mp4) {
      const s = document.createElement('source'); s.src = mp4; s.type = 'video/mp4'; vid.appendChild(s);
    }
    vid.dataset.ready = '1';
    vid.load();
    preloadedClips.add(vid.dataset.srcMp4 || webm);
  }
  return vid;
}

function stopFrontVideo() {
  if (frontVideoEl) {
    try { frontVideoEl.pause(); } catch (_) {}
    frontVideoEl.classList.remove('-on');
    const img = frontVideoEl.parentElement && frontVideoEl.parentElement.querySelector('img');
    if (img) img.classList.remove('-dim');
    frontVideoEl = null;
  }
  // Also pause any other card videos that somehow play
  ring.querySelectorAll('video.-on').forEach(v => {
    v.classList.remove('-on');
    try { v.pause(); } catch (_) {}
    const img = v.parentElement && v.parentElement.querySelector('img');
    if (img) img.classList.remove('-dim');
  });
}

function playFrontVideo(cardEl) {
  if (detailOpen || REDUCE) return;
  stopFrontVideo();
  const vid = ensureCardVideo(cardEl);
  if (!vid) return;
  frontVideoEl = vid;
  const img = vid.parentElement.querySelector('img');
  const tryPlay = () => {
    vid.currentTime = 0;
    const p = vid.play();
    if (p && p.then) p.then(() => {
      vid.classList.add('-on');
      if (img) img.classList.add('-dim');
    }).catch(() => {});
    else {
      vid.classList.add('-on');
      if (img) img.classList.add('-dim');
    }
  };
  if (vid.readyState >= 2) tryPlay();
  else vid.addEventListener('loadeddata', tryPlay, { once: true });
}

function render() {
  const fs = frontSlot();
  /* Scale + z so neighbors recede behind the center card (never cover its label/number). */
  ring.querySelectorAll('.card').forEach((el) => {
    const slot = +el.dataset.slot;
    let d = Math.abs(slot - fs);
    if (d > CFG.slots / 2) d = CFG.slots - d;
    const s = d === 0 ? 1 : (d === 1 ? 0.76 : Math.max(0.58, 1 - 0.14 * d));
    const zb = d === 0 ? 0 : Math.round(40 + d * 48);
    el.style.setProperty('--s', s.toFixed(3));
    el.style.setProperty('--zb', zb + 'px');
    el.style.zIndex = String(40 - d);
    el.classList.toggle('-front', slot === fs);
    /* Hide far cards on narrow screens — their projected edges drew the vertical seam ~x=345. */
    const hideFar = innerWidth <= 760 && d > 2;
    if (hideFar) {
      el.style.opacity = '0';
      el.style.visibility = 'hidden';
      el.style.pointerEvents = 'none';
    } else if (innerWidth <= 760 && d === 1) {
      el.style.opacity = '0.88';
      el.style.visibility = '';
      el.style.pointerEvents = '';
    } else {
      el.style.opacity = '';
      el.style.visibility = '';
      el.style.pointerEvents = '';
    }
  });
  if (fs !== lastFrontSlot) {
    lastFrontSlot = fs;
    const neu = ring.querySelector(`.card[data-slot="${fs}"]`);
    if (!detailOpen) {
      if (neu) playFrontVideo(neu);
      else stopFrontVideo();
    }
  }
  const ci = fs % CARDS.length;
  if (ci !== lastCard) {
    const cd = CARDS[ci];
    document.getElementById('d-title').textContent = cd.title;
    document.getElementById('d-meta').textContent = cd.meta;
    document.getElementById('d-rating').textContent = cd.rating;
    document.getElementById('d-cur').textContent = pad2(ci+1);
    ghost.textContent = pad2(ci+1);
    [...dotsEl.children].forEach((b, i) => b.classList.toggle('-on', i === ci));
    lastCard = ci;
    // Preload upcoming neighbor clips lightly
    const next = ring.querySelector(`.card[data-slot="${(fs + 1) % CFG.slots}"]`);
    const prev = ring.querySelector(`.card[data-slot="${(fs - 1 + CFG.slots) % CFG.slots}"]`);
    // Only ensure sources for neighbors without playing
    if (next) ensureCardVideo(next);
    if (prev) ensureCardVideo(prev);
  }
}

function fillDetail(cd) {
  document.getElementById('detail-kicker').textContent = cd.kicker;
  document.getElementById('detail-title').textContent = cd.title;
  document.getElementById('detail-blurb').textContent = cd.blurb;
  const stepsEl = document.getElementById('detail-steps');
  const ul = document.getElementById('detail-bullets');
  if (cd.steps && cd.steps.length) {
    stepsEl.hidden = false;
    stepsEl.innerHTML = cd.steps.map((s, i) => '<li><span class="n">Step '+ (i+1) +'</span><span>'+s+'</span></li>').join('');
    ul.innerHTML = '';
  } else {
    stepsEl.hidden = true;
    stepsEl.innerHTML = '';
    ul.innerHTML = cd.bullets.map(b => '<li>'+b+'</li>').join('');
  }
  const base = clipBase(cd);
  detailImg.src = ASSET_BASE_URL + '/' + base + '-poster.jpg';
  detailImg.alt = cd.title;
  detailFlyImg.src = ASSET_BASE_URL + '/' + cd.img;
  detailFlyImg.alt = '';
  // Prepare detail video (lazy source assign)
  detailVideo.pause();
  detailVideo.removeAttribute('src');
  detailVideo.querySelectorAll('source').forEach(s => s.remove());
  const sWebm = document.createElement('source');
  sWebm.src = ASSET_BASE_URL + '/' + base + '.webm';
  sWebm.type = 'video/webm';
  const sMp4 = document.createElement('source');
  sMp4.src = ASSET_BASE_URL + '/' + base + '.mp4';
  sMp4.type = 'video/mp4';
  detailVideo.appendChild(sWebm);
  detailVideo.appendChild(sMp4);
  detailVideo.poster = ASSET_BASE_URL + '/' + base + '-poster.jpg';
  detailVideo.load();
  detailLearn.href = '#';
  detailLearn.innerHTML = 'Learn more <span aria-hidden="true">→</span>';
}

function openDetail(cardIndex, cardEl) {
  if (detailOpen) return;
  const cd = CARDS[cardIndex];
  fillDetail(cd);
  lastFocus = document.activeElement;
  detailOpen = true;
  detail.hidden = false;
  detail.classList.add('-open');
  detail.classList.remove('-ready');
  stage.classList.add('-locked');
  vel = 0; dragging = false; settled = true;

  const inner = cardEl.querySelector('.card__inner') || cardEl;
  const rect = inner.getBoundingClientRect();
  detailFly.style.transition = 'none';
  detailFly.style.opacity = '1';
  detailFly.style.left = rect.left + 'px';
  detailFly.style.top = rect.top + 'px';
  detailFly.style.width = rect.width + 'px';
  detailFly.style.height = rect.height + 'px';
  detailFly.style.borderRadius = getComputedStyle(section).getPropertyValue('--corner').trim() || '16px';

  // final media rect approximation (desktop: left column of sheet; mobile: top block)
  const mobile = innerWidth <= 760;
  let final;
  if (mobile) {
    final = { left: 0, top: 0, width: innerWidth, height: Math.max(innerHeight * 0.4, 260) };
  } else {
    const sheetW = Math.min(920, innerWidth - 96);
    const sheetH = Math.min(innerHeight * 0.86, 720);
    const sheetL = (innerWidth - sheetW) / 2;
    const sheetT = (innerHeight - sheetH) / 2;
    final = { left: sheetL, top: sheetT, width: sheetW * 0.38, height: sheetH };
  }

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      if (!REDUCE) {
        detailFly.style.transition = '';
        detailFly.style.left = final.left + 'px';
        detailFly.style.top = final.top + 'px';
        detailFly.style.width = final.width + 'px';
        detailFly.style.height = final.height + 'px';
        detailFly.style.borderRadius = mobile ? '0px' : '20px 0 0 20px';
      } else {
        detailFly.style.opacity = '0';
      }
      setTimeout(() => {
        detail.classList.add('-ready');
        detailFly.style.opacity = '0';
        detailClose.focus();
        stopFrontVideo();
        // Play detail clip
        if (!REDUCE) {
          vidCtrl.hidden = false;
          vidCtrl.textContent = '❚❚ Pause';
          vidCtrl.setAttribute('aria-label', 'Pause video');
          const playDetail = () => {
            detailVideo.currentTime = 0;
            const p = detailVideo.play();
            if (p && p.catch) p.catch(() => {});
          };
          if (detailVideo.readyState >= 2) playDetail();
          else detailVideo.addEventListener('loadeddata', playDetail, { once: true });
        } else {
          vidCtrl.hidden = true;
        }
      }, REDUCE ? 0 : 450);
    });
  });
}

function closeDetail() {
  if (!detailOpen) return;
  detail.classList.remove('-ready');
  try { detailVideo.pause(); } catch (_) {}
  vidCtrl.hidden = true;
  const front = ring.querySelector('.card.-front .card__inner') || ring.querySelector('.card.-front');
  const rect = front ? front.getBoundingClientRect() : { left: innerWidth/2-80, top: innerHeight/2-110, width: 160, height: 220 };
  detailFly.style.opacity = '1';
  if (!REDUCE) {
    detailFly.style.transition = '';
    detailFly.style.left = rect.left + 'px';
    detailFly.style.top = rect.top + 'px';
    detailFly.style.width = rect.width + 'px';
    detailFly.style.height = rect.height + 'px';
    detailFly.style.borderRadius = getComputedStyle(section).getPropertyValue('--corner').trim() || '16px';
  }
  setTimeout(() => {
    detail.classList.remove('-open');
    detail.hidden = true;
    detailFly.style.opacity = '0';
    stage.classList.remove('-locked');
    detailOpen = false;
    // Clear detail sources so they can be GC'd; front card resumes
    detailVideo.removeAttribute('src');
    detailVideo.querySelectorAll('source').forEach(s => s.remove());
    detailVideo.load();
    const frontCard = ring.querySelector('.card.-front');
    if (frontCard) playFrontVideo(frontCard);
    if (lastFocus && lastFocus.focus) lastFocus.focus();
    else stage.focus();
  }, REDUCE ? 0 : 450);
}

function trapFocus(e) {
  if (!detailOpen || e.key !== 'Tab') return;
  const focusables = detail.querySelectorAll('button, a[href], [tabindex]:not([tabindex="-1"])');
  const list = [...focusables].filter(el => !el.hasAttribute('disabled') && el.offsetParent !== null);
  if (!list.length) return;
  const first = list[0], last = list[list.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

stage.addEventListener('pointerdown', e => {
  if (detailOpen) return;
  dragging = true; lastX = downX = e.clientX; moved = false; vel = 0; settled = false;
  stage.classList.add('-drag');
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => {
  if (!dragging || detailOpen) return;
  const dx = e.clientX - lastX; lastX = e.clientX;
  if (Math.abs(e.clientX - downX) > 6) moved = true;
  const d = -dx * CFG.drag; rot += d; vel = d;
});
stage.addEventListener('pointerup', e => {
  if (detailOpen) return;
  dragging = false; settled = false; stage.classList.remove('-drag');
  if (!moved) {
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const card = el && el.closest('.card');
    if (card) {
      const slot = +card.dataset.slot;
      if (slot === frontSlot()) openDetail(slot % CARDS.length, card);
      else focusSlot(slot);
    }
  }
});
stage.addEventListener('pointercancel', () => { dragging = false; stage.classList.remove('-drag'); });

stage.addEventListener('keydown', e => {
  if (detailOpen) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); go(-1); }
  if (e.key === 'Enter' || e.key === ' ') {
    const front = ring.querySelector('.card.-front');
    if (front) { e.preventDefault(); openDetail(frontSlot() % CARDS.length, front); }
  }
});
document.getElementById('next').addEventListener('click', () => go(1));
document.getElementById('prev').addEventListener('click', () => go(-1));

detailBackdrop.addEventListener('click', closeDetail);
detailClose.addEventListener('click', closeDetail);
document.addEventListener('keydown', e => {
  if (!detailOpen) return;
  if (e.key === 'Escape') { e.preventDefault(); closeDetail(); }
  trapFocus(e);
});

// swipe-down to close on mobile
detailSheet.addEventListener('touchstart', e => {
  if (!detailOpen) return;
  swipeStartY = e.touches[0].clientY;
}, { passive: true });
detailSheet.addEventListener('touchend', e => {
  if (!detailOpen) return;
  const dy = e.changedTouches[0].clientY - swipeStartY;
  if (dy > 80) closeDetail();
}, { passive: true });

function tick() {
  if (!dragging && !detailOpen) {
    rot += vel; vel *= CFG.damp;
    if (CFG.autoSpin > 0) { rot += CFG.autoSpin; }
    else if (Math.abs(vel) < 0.05) {
      if (!settled) { targetIndex = nearestCenter(); settled = true; }
      const diff = -targetIndex * stepDeg() - rot;
      if (Math.abs(diff) < 0.01) rot = -targetIndex * stepDeg();
      else rot += diff * (REDUCE ? 1 : 0.14);
    } else settled = false;
  }
  applyRot(); render();
  requestAnimationFrame(tick);
}

vidCtrl.addEventListener('click', () => {
  if (detailVideo.paused) {
    detailVideo.play().catch(() => {});
    vidCtrl.textContent = '❚❚ Pause';
    vidCtrl.setAttribute('aria-label', 'Pause video');
  } else {
    detailVideo.pause();
    vidCtrl.textContent = '▶ Replay';
    vidCtrl.setAttribute('aria-label', 'Replay video');
  }
});
detailVideo.addEventListener('play', () => {
  vidCtrl.textContent = '❚❚ Pause';
  vidCtrl.setAttribute('aria-label', 'Pause video');
});
detailVideo.addEventListener('pause', () => {
  if (detailOpen) {
    vidCtrl.textContent = '▶ Replay';
    vidCtrl.setAttribute('aria-label', 'Replay video');
  }
});

buildRing(); buildDots(); layout(); applyStyles(); applyRot(); render(); tick();
// Kick front-card clip once settled
requestAnimationFrame(() => {
  const front = ring.querySelector('.card.-front');
  if (front) playFrontVideo(front);
});
window.addEventListener('resize', layout);
</script>
</body>
</html>
