<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Score OS — Colosseum Arena (Preview)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,400;0,9..144,500;1,9..144,340&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1a1510; overflow: hidden; }
  #section { position: fixed; inset: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color: var(--ink);
    --ink: #1a1510; --ink-2: #5c5348; --ink-3: #8a7f70;
    --line: rgba(26,21,16,.18); --line-2: rgba(26,21,16,.08);
    --accent: #10B981; --gold: #C9A227;
    --trav: #efe6d6; --trav-2: #d9c7a7; --trav-3: #b89b72;
    --corner: 18px; --hover: 1.04; --scrim: .85; --shadow: 1;
    --title-size: 15px; --title-color: #1a1510;
    --bg-top: #f7ecd8; --bg-bottom: #c9a574;
  }
  #preview-banner {
    position: fixed; top: 0; left: 50%; transform: translateX(-50%); z-index: 20;
    background: rgba(26,21,16,.78); color: #efe6d6; font-size: 11px; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase; padding: 6px 16px; border-radius: 0 0 10px 10px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); pointer-events: none;
  }
  #stage { position: fixed; inset: 0; overflow: hidden;
    background:
      radial-gradient(120% 70% at 50% -5%, #fff6e4 0%, transparent 55%),
      linear-gradient(180deg, #f7ecd8 0%, #e8d4b0 28%, #c9a574 58%, #8b6b4a 78%, #5c4530 100%);
    perspective: 1200px; perspective-origin: 50% 48%;
    display: grid; place-items: center;
    cursor: grab; touch-action: none; user-select: none; outline: none; }
  #stage.-drag { cursor: grabbing; }
  #arena-wall {
    position: absolute; left: 50%; top: 42%; width: 140vw; height: 38vh; z-index: 0;
    transform: translate(-50%, -50%);
    background:
      repeating-linear-gradient(90deg, rgba(184,155,114,.22) 0 18px, rgba(217,199,167,.12) 18px 36px),
      linear-gradient(180deg, rgba(92,69,48,.15), rgba(26,21,16,.35));
    border-radius: 50% 50% 0 0 / 18% 18% 0 0;
    filter: blur(.4px); pointer-events: none; opacity: .7;
  }
  #floor { position: absolute; left: 50%; top: 80%; width: 140vw; height: 60vh; z-index: 0;
    transform: translate(-50%,-50%) perspective(700px) rotateX(68deg);
    background:
      radial-gradient(45% 40% at 50% 35%, rgba(26,21,16,.4), transparent 72%),
      radial-gradient(70% 70% at 50% 55%, #e0cfaa 0%, #c9b896 40%, #b89b72 70%, #8b6b4a 100%);
    box-shadow: inset 0 50px 100px rgba(26,21,16,.3);
    pointer-events: none; border-radius: 50%; filter: blur(0.3px); }
  #floor-shadow {
    position: absolute; left: 50%; top: 62%; width: 40vw; height: 18vh; z-index: 0;
    transform: translate(-50%,-50%);
    background: radial-gradient(50% 50% at 50% 50%, rgba(26,21,16,.28), transparent 70%);
    filter: blur(10px); pointer-events: none;
  }
  #dust { position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: .55; }
  #vignette {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background:
      radial-gradient(70% 65% at 50% 45%, transparent 40%, rgba(26,21,16,.22) 100%),
      linear-gradient(90deg, rgba(92,69,48,.18), transparent 18%, transparent 82%, rgba(92,69,48,.18));
  }

  #ghost { position: absolute; left: 50%; top: 48%; z-index: 0; transform: translate(-50%,-50%);
    font-family: 'Fraunces', Georgia, serif; font-weight: 400; font-size: 36vh; line-height: .8;
    color: rgba(26,21,16,.06); letter-spacing: -.02em; pointer-events: none; user-select: none; }
  #ring, #ring2 { position: relative; width: 0; height: 0; transform-style: preserve-3d; z-index: 1;
    transform: translateY(var(--lift, 0px)) translateZ(var(--push, 0px)) rotateY(var(--rot, 0deg)); }
  #ring2 { z-index: 0; opacity: .38; filter: brightness(.85) saturate(.7); pointer-events: none; }
  .card { position: absolute; width: var(--cw, 200px); height: var(--ch, 280px);
    left: calc(var(--cw, 200px) / -2); top: calc(var(--ch, 280px) / -2);
    transform: rotateY(var(--a)) translateZ(calc(var(--r, 620px) * -1));
    backface-visibility: hidden; -webkit-backface-visibility: hidden; transform-style: preserve-3d; }
  .card__inner {
    position: absolute; inset: 0;
    border-radius: 50% 50% 14px 14px / 32% 32% 14px 14px;
    overflow: hidden;
    background: linear-gradient(160deg, #f3ebdc 0%, #e2d2b4 40%, #cbb892 100%);
    border: 3px solid #b89b72;
    box-shadow:
      0 26px 60px -18px rgba(26,21,16, calc(.5 * var(--shadow))),
      0 6px 16px -8px rgba(26,21,16, calc(.35 * var(--shadow))),
      inset 0 1px 0 rgba(255,255,255,.45),
      inset 0 -8px 20px rgba(92,69,48,.18);
    transition: transform .4s cubic-bezier(.22,.61,.36,1), box-shadow .4s ease;
    backface-visibility: hidden; -webkit-backface-visibility: hidden; will-change: transform;
  }
  .card__inner::before {
    content: ''; position: absolute; inset: 6px; z-index: 1; pointer-events: none;
    border-radius: 48% 48% 10px 10px / 30% 30% 10px 10px;
    border: 1px solid rgba(184,155,114,.55);
  }
  .card.-front .card__inner {
    border-color: var(--gold);
    box-shadow:
      0 40px 90px -20px rgba(26,21,16,.55),
      0 8px 22px -8px rgba(26,21,16,.4),
      0 0 0 2px rgba(201,162,39,.35),
      inset 0 1px 0 rgba(255,255,255,.5);
  }
  .card:hover .card__inner { transform: scale(var(--hover)); }
  .card__art { position: absolute; inset: 10px 10px 48px; z-index: 0;
    border-radius: 46% 46% 8px 8px / 28% 28% 8px 8px; overflow: hidden; background: #1a2332; }
  .card__art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card__scrim { position: absolute; inset: 0; pointer-events: none; opacity: var(--scrim); z-index: 2;
    background: linear-gradient(to top, rgba(26,21,16,.75) 0%, rgba(26,21,16,.2) 28%, transparent 50%);
    border-radius: inherit; }
  .card__no { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); z-index: 3;
    font-size: 11px; font-weight: 600; letter-spacing: .18em; color: rgba(239,230,214,.95);
    text-shadow: 0 1px 8px rgba(0,0,0,.45); font-family: 'Fraunces', Georgia, serif; }
  .card__foot { position: absolute; left: 14px; right: 14px; bottom: 14px; z-index: 3; text-align: center; }
  .card__title { margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 400;
    font-size: var(--title-size); line-height: 1.1; letter-spacing: -.01em;
    color: var(--ink); text-shadow: 0 1px 0 rgba(255,255,255,.35); }
  #frame { position: fixed; inset: 16px; z-index: 3; pointer-events: none;
    border: 1px solid rgba(184,155,114,.28); border-radius: 6px; }
  #frame i { position: absolute; width: 9px; height: 9px; }
  #frame i::before, #frame i::after { content: ''; position: absolute; background: rgba(184,155,114,.55); }
  #frame i::before { left: 0; top: 0; width: 9px; height: 1px; }
  #frame i::after  { left: 0; top: 0; width: 1px; height: 9px; }
  #frame .tl { left: -1px; top: -1px; }
  #frame .tr { right: -1px; top: -1px; transform: scaleX(-1); }
  #frame .bl { left: -1px; bottom: -1px; transform: scaleY(-1); }
  #frame .br { right: -1px; bottom: -1px; transform: scale(-1); }
  #top { position: fixed; top: 22px; left: 0; right: 0; z-index: 6;
    display: flex; align-items: center; justify-content: space-between;
    padding: clamp(12px, 2vh, 24px) clamp(24px, 4vw, 52px); }
  #brand { display: flex; align-items: center; gap: 11px; font-weight: 600; font-size: 15px; letter-spacing: .01em; color: var(--ink); }
  #brand svg { width: 22px; height: 22px; display: block; color: var(--accent); }
  #brand .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin-left: 2px; }
  #nav { display: flex; gap: clamp(18px, 2.6vw, 38px); }
  #nav a { color: var(--ink-2); text-decoration: none; font-size: 14px; font-weight: 500; letter-spacing: .01em;
    position: relative; transition: color .2s; }
  #nav a::after { content: ''; position: absolute; left: 0; right: 100%; bottom: -5px; height: 1px;
    background: var(--ink); transition: right .28s cubic-bezier(.22,.61,.36,1); }
  #nav a:hover, #nav a:focus-visible { color: var(--ink); }
  #nav a:hover::after, #nav a:focus-visible::after { right: 0; }
  #cta { display: inline-flex; align-items: center; gap: 8px; padding: 9px 17px; border-radius: 999px;
    background: var(--accent); color: #06281c; font-size: 13px; font-weight: 600; letter-spacing: .01em;
    text-decoration: none; border: 1px solid var(--accent); transition: transform .2s ease, background .2s ease; white-space: nowrap;
    box-shadow: 0 6px 18px -8px rgba(16,185,129,.55); }
  #cta:hover { transform: translateY(-1px); background: #0ea572; }
  #cta .arw { transition: transform .25s ease; }
  #cta:hover .arw { transform: translateX(3px); }
  #mast { position: fixed; top: clamp(72px, 11vh, 118px); left: 0; right: 0; z-index: 4;
    text-align: center; pointer-events: none; padding: 0 20px; }
  #eyebrow { display: inline-flex; align-items: center; gap: 9px; font-size: 11px; font-weight: 600;
    letter-spacing: .26em; text-transform: uppercase; color: var(--ink-3); }
  #eyebrow::before, #eyebrow::after { content: ''; width: 26px; height: 1px; background: var(--line); }
  #headline { margin: 12px 0 0; font-family: 'Fraunces', Georgia, serif; font-weight: 340;
    font-size: clamp(26px, 4.2vw, 52px); line-height: 1.05; letter-spacing: -.018em; color: var(--ink);
    text-wrap: balance; text-shadow: 0 1px 0 rgba(255,255,255,.35); }
  #headline em { font-style: italic; font-weight: 400; color: #0a7a56; }
  .edge { position: fixed; top: 50%; z-index: 4; font-size: 10.5px; font-weight: 600; letter-spacing: .28em;
    text-transform: uppercase; color: var(--ink-3); pointer-events: none; white-space: nowrap; }
  .edge.-l { left: clamp(22px, 3.4vw, 40px); transform: translateY(-50%) rotate(-90deg); transform-origin: left center; }
  .edge.-r { right: clamp(22px, 3.4vw, 40px); transform: translateY(-50%) rotate(90deg); transform-origin: right center; }
  #dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 24px;
    padding: 0 clamp(24px, 4vw, 56px) clamp(22px, 4vh, 40px); pointer-events: none; }
  #dock > * { pointer-events: auto; }
  .dock__count { font-variant-numeric: tabular-nums; letter-spacing: .04em; font-size: 13px; color: var(--ink-3); }
  .dock__count b { font-size: 30px; font-weight: 500; color: var(--ink); font-family: 'Fraunces', serif; letter-spacing: 0; }
  .dock__count i { font-style: normal; }
  .dock__c { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .dock__title { margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 400;
    font-size: clamp(20px, 2.6vw, 32px); line-height: 1; letter-spacing: -.01em; color: var(--ink); }
  .dock__sub { display: flex; align-items: center; gap: 14px; font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
  .dock__tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
    background: rgba(16,185,129,.14); color: #0a7a56; font-size: 11px; font-weight: 600; letter-spacing: .04em; }
  .dock__tag.-diy { background: rgba(201,162,39,.18); color: #8a6d12; }
  .dock__pip { width: 3px; height: 3px; border-radius: 50%; background: var(--line); }
  #dots { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; justify-content: center; max-width: 280px; }
  #dots button { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--line); transition: width .3s cubic-bezier(.22,.61,.36,1), background .3s ease; }
  #dots button.-on { width: 24px; background: var(--accent); }
  .dock__r { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
  .navbtn { width: 48px; height: 48px; border-radius: 999px; border: 1px solid rgba(184,155,114,.45);
    background: rgba(239,230,214,.7); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    color: var(--ink); font-size: 19px; line-height: 1; cursor: pointer; display: grid; place-items: center;
    transition: background .2s ease, color .2s ease, border-color .2s ease, transform .15s ease; }
  .navbtn:hover { background: var(--ink); color: #efe6d6; border-color: var(--ink); }
  .navbtn:active { transform: scale(.94); }
  .hint { position: fixed; left: 50%; bottom: clamp(124px, 17vh, 156px); transform: translateX(-50%); z-index: 4;
    font-size: 10.5px; letter-spacing: .3em; text-transform: uppercase; font-weight: 600; color: var(--ink-3);
    pointer-events: none; user-select: none; opacity: .9; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  @media (max-width: 1024px) {
    #ghost { font-size: 28vh; }
    .edge { display: none; }
    #ring2 { display: none; }
  }
  @media (max-width: 760px) {
    #nav { display: none; }
    #cta { padding: 8px 13px; }
    #frame { inset: 10px; }
    #mast { top: clamp(68px, 10vh, 96px); }
    #dock { grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
      padding-bottom: clamp(18px, 3vh, 28px); }
    .dock__count b { font-size: 22px; }
    .dock__count i, .dock__count .of { display: none; }
    .dock__c { gap: 9px; }
    .hint { display: none; }
    .navbtn { width: 44px; height: 44px; }
    #preview-banner { font-size: 10px; padding: 5px 12px; }
  }
  @media (max-width: 420px) {
    #dots { display: none; }
    .dock__sub { font-size: 11.5px; gap: 8px; }
  }
  @media (max-height: 560px) {
    #mast { top: 56px; }
    #headline { font-size: clamp(20px, 5vw, 32px); }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card__inner, #dots button, #nav a::after { transition: none; }
  }

</style>
</head>
<body>
<div id="section">
  <div id="preview-banner">Preview only · not live</div>
  <div id="stage" tabindex="0" role="region" aria-label="Score OS Arena — draggable 3D carousel. Use left and right arrow keys to move between features.">
    <div id="arena-wall"></div>
    <div id="floor"></div>
    <div id="floor-shadow"></div>
    <div id="ghost">I</div>
    <div id="ring2" aria-hidden="true"></div>
    <div id="ring"></div>
    <canvas id="dust"></canvas>
    <div id="vignette"></div>
  </div>
  <div id="frame"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
  <header id="top">
    <div id="brand">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.4"/><circle cx="12" cy="12" r="3.4" fill="currentColor"/></svg>
      <span id="brand-name">Score OS</span>
      <span class="dot"></span>
    </div>
    <nav id="nav" aria-label="Primary"></nav>
    <a id="cta" href="#">Get started <span class="arw">→</span></a>
  </header>
  <div id="mast">
    <span id="eyebrow"></span>
    <h1 id="headline"></h1>
  </div>
  <div class="edge -l" id="edge-l"></div>
  <div class="edge -r" id="edge-r"></div>
  <div class="hint">Drag · swipe · arrow keys</div>
  <footer id="dock">
    <div class="dock__l">
      <div class="dock__count"><b id="d-cur">I</b> <i class="of">/ <span id="d-total">IX</span></i></div>
    </div>
    <div class="dock__c" aria-live="polite">
      <h2 class="dock__title" id="d-title"></h2>
      <div class="dock__sub">
        <span id="d-meta"></span>
        <span class="dock__pip"></span>
        <span class="dock__tag" id="d-tag">Agency OS</span>
      </div>
      <div id="dots" role="tablist" aria-label="Jump to feature"></div>
    </div>
    <div class="dock__r">
      <button class="navbtn" id="prev" aria-label="Previous feature">‹</button>
      <button class="navbtn" id="next" aria-label="Next feature">›</button>
    </div>
  </footer>
</div>

h%3D%2266%22%20height%3D%228%22%20rx%3D%224%22%20fill%3D%22%23efe6d6%22%20opacity%3D%22.35%22/%3E%3Crect%20x%3D%2272%22%20y%3D%22222%22%20width%3D%2266%22%20height%3D%228%22%20rx%3D%224%22%20fill%3D%22%23C9A227%22%20opacity%3D%22.6%22/%3E%0A%3Crect%20x%3D%22165%22%20y%3D%22110%22%20width%3D%22175%22%20height%3D%2270%22%20rx%3D%2210%22%20fill%3D%22%231e2a3c%22/%3E%3Crect%20x%3D%22178%22%20y%3D%22128%22%20width%3D%2280%22%20height%3D%2210%22%20rx%3D%225%22%20fill%3D%22%23efe6d6%22%20opacity%3D%22.5%22/%3E%3Crect%20x%3D%22178%22%20y%3D%22148%22%20width%3D%22120%22%20height%3D%228%22%20rx%3D%224%22%20fill%3D%22%2310B981%22%20opacity%3D%22.7%22/%3E%0A%3Crect%20x%3D%22165%22%20y%3D%22196%22%20width%3D%2280%22%20height%3D%22100%22%20rx%3D%2210%22%20fill%3D%22%231e2a3c%22/%3E%3Crect%20x%3D%22175%22%20y%3D%22214%22%20width%3D%2260%22%20height%3D%2260%22%20rx%3D%228%22%20fill%3D%22%2310B981%22%20opacity%3D%22.25%22/%3E%3Ctext%20x%3D%22205%22%20y%3D%22250%22%20text-anchor%3D%22middle%22%20fill%3D%22%2310B981%22%20font-family%3D%22Georgia%2Cserif%22%20font-size%3D%2222%22%3E42%3C/text%3E%0A%3Crect%20x%3D%22260%22%20y%3D%22196%22%20width%3D%2280%22%20height%3D%22100%22%20rx%3D%2210%22%20fill%3D%22%231e2a3c%22/%3E%3Crect%20x%3D%22270%22%20y%3D%22214%22%20width%3D%2260%22%20height%3D%2260%22%20rx%3D%228%22%20fill%3D%22%23C9A227%22%20opacity%3D%22.25%22/%3E%3Ctext%20x%3D%22300%22%20y%3D%22250%22%20text-anchor%3D%22middle%22%20fill%3D%22%23C9A227%22%20font-family%3D%22Georgia%2Cserif%22%20font-size%3D%2222%22%3E18%3C/text%3E%0A%3Crect%20x%3D%22165%22%20y%3D%22312%22%20width%3D%22175%22%20height%3D%22100%22%20rx%3D%2210%22%20fill%3D%22%231e2a3c%22/%3E%0A%3Crect%20x%3D%22178%22%20y%3D%22332%22%20width%3D%22150%22%20height%3D%228%22%20rx%3D%224%22%20fill%3D%22%232d3c54%22/%3E%3Crect%20x%3D%22178%22%20y%3D%22332%22%20width%3D%22100%22%20height%3D%228%22%20rx%3D%224%22%20fill%3D%22%2310B981%22/%3E%0A%3Crect%20x%3D%22178%22%20y%3D%22356%22%20width%3D%22150%22%20height%3D%228%22%20rx%3D%224%22%20fill%3D%22%232d3c54%22/%3E%3Crect%20x%3D%22178%22%20y%3D%22356%22%20width%3D%2270%22%20height%3D%228%22%20rx%3D%224%22%20fill%3D%22%23C9A227%22/%3E%0A%3Crect%20x%3D%22178%22%20y%3D%22380%22%20width%3D%22150%22%20height%3D%228%22%20rx%3D%224%22%20fill%3D%22%232d3c54%22/%3E%3Crect%20x%3D%22178%22%20y%3D%22380%22%20width%3D%22120%22%20height%3D%228%22%20rx%3D%224%22%20fill%3D%22%2310B981%22/%3E%0A%3C/svg%3E"};
const CFG = {
  slots: 18,
  cardScale: 1.0,
  cardRatio: 1.38,
  radiusK: 3.15,
  arcDepth: 1.0,
  perspective: 0.95,
  autoSpin: 0,
  drag: 0.14,
  damp: 0.93,
  tier2: true,
};
const CARDS = [
  {
    "img": "portal",
    "title": "Client Portal",
    "tag": "Agency OS",
    "meta": "Branded client experience"
  },
  {
    "img": "dispute",
    "title": "Dispute Center",
    "tag": "Agency OS",
    "meta": "Organize every round"
  },
  {
    "img": "maxine",
    "title": "Maxine AI",
    "tag": "Agency OS",
    "meta": "Sample report analysis"
  },
  {
    "img": "auto",
    "title": "Automations",
    "tag": "Agency OS",
    "meta": "Onboard \u00b7 remind \u00b7 follow up"
  },
  {
    "img": "msg",
    "title": "Two-way Messaging",
    "tag": "Agency OS",
    "meta": "Keep clients in the loop"
  },
  {
    "img": "cal",
    "title": "Booking Calendar",
    "tag": "Agency OS",
    "meta": "Schedule without the chase"
  },
  {
    "img": "brand",
    "title": "White-label Branding",
    "tag": "Agency OS",
    "meta": "Your brand. Not ours."
  },
  {
    "img": "affiliate",
    "title": "Affiliate Tracking",
    "tag": "Agency OS",
    "meta": "Grow your roster"
  },
  {
    "img": "crm",
    "title": "Agency CRM",
    "tag": "Agency OS",
    "meta": "Leads, clients, notes"
  }
];
const UI = {
  brand:    'Score OS',
  nav:      ['Platform', 'Maxine AI', 'Pricing', 'DIY OS'],
  cta:      'Get started',
  eyebrow:  'The Score OS Arena',
  headline: 'Your agency,<br>at the centre of the <em>arena</em>',
  edgeL:    'Agency OS',
  edgeR:    'Preview — 2026',
};
const ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII'];
const toRoman = n => ROMAN[n-1] || String(n);
const stepDeg = () => 360 / CFG.slots;
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;

const section = document.getElementById('section');
const stage = document.getElementById('stage');
const ring = document.getElementById('ring');
const ring2 = document.getElementById('ring2');
const ghost = document.getElementById('ghost');
const dotsEl = document.getElementById('dots');

document.getElementById('brand-name').textContent = UI.brand;
document.getElementById('nav').innerHTML = UI.nav.map(n => '<a href="#">'+n+'</a>').join('');
const cta = document.getElementById('cta');
cta.childNodes[0].textContent = UI.cta + ' ';
document.getElementById('eyebrow').textContent = UI.eyebrow;
document.getElementById('headline').innerHTML = UI.headline;
document.getElementById('edge-l').textContent = UI.edgeL;
document.getElementById('edge-r').textContent = UI.edgeR;
document.getElementById('d-total').textContent = toRoman(CARDS.length);

function applyStyles() {
  const s = {
    '--bg-top': '#f7ecd8', '--bg-bottom': '#c9a574', '--accent': '#10B981',
    '--corner': '18px', '--shadow': '1', '--hover': '1.04', '--scrim': '0.85',
    '--title-size': '15px', '--title-color': '#1a1510',
  };
  for (const [k,v] of Object.entries(s)) section.style.setProperty(k, v);
}

function cardMarkup(cd, roman) {
  const src = ARTS[cd.img] || '';
  return `<div class="card__inner">
      <div class="card__art"><img src="${src}" alt="${cd.title}" draggable="false" loading="lazy"></div>
      <div class="card__scrim"></div>
      <span class="card__no">${roman}</span>
      <div class="card__foot"><h3 class="card__title">${cd.title}</h3></div>
    </div>`;
}

function buildRing() {
  ring.innerHTML = '';
  for (let i = 0; i < CFG.slots; i++) {
    const cd = CARDS[i % CARDS.length];
    const art = document.createElement('article');
    art.className = 'card';
    art.dataset.slot = i;
    art.style.setProperty('--a', (i * stepDeg()) + 'deg');
    art.innerHTML = cardMarkup(cd, toRoman((i % CARDS.length) + 1));
    ring.appendChild(art);
  }
  ring2.innerHTML = '';
  if (CFG.tier2) {
    for (let i = 0; i < CFG.slots; i++) {
      const cd = CARDS[(i + 3) % CARDS.length];
      const art = document.createElement('article');
      art.className = 'card';
      art.dataset.slot = i;
      art.style.setProperty('--a', ((i + 0.5) * stepDeg()) + 'deg');
      art.innerHTML = cardMarkup(cd, '');
      const no = art.querySelector('.card__no'); if (no) no.remove();
      const foot = art.querySelector('.card__foot'); if (foot) foot.remove();
      ring2.appendChild(art);
    }
  }
}

function buildDots() {
  dotsEl.innerHTML = '';
  CARDS.forEach((cd, i) => {
    const b = document.createElement('button');
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-label', 'Go to ' + cd.title);
    b.addEventListener('click', () => focusWork(i));
    dotsEl.appendChild(b);
  });
}

function layout() {
  const vw = innerWidth;
  const cw = Math.min(210, Math.max(132, vw * 0.145)) * CFG.cardScale;
  const ch = cw * CFG.cardRatio;
  const r  = cw * CFG.radiusK;
  stage.style.setProperty('--cw', cw + 'px');
  stage.style.setProperty('--ch', ch + 'px');
  stage.style.setProperty('--r',  r + 'px');
  stage.style.setProperty('--push', (r * (1 - CFG.arcDepth)) + 'px');
  stage.style.perspective = Math.max(680, vw * 0.78 * CFG.perspective) + 'px';
  const r2 = r * 1.12;
  const cw2 = cw * 0.72;
  const ch2 = cw2 * CFG.cardRatio;
  ring2.style.setProperty('--push', (r2 * (1 - CFG.arcDepth)) + 'px');
  ring2.style.setProperty('--lift', (-ch * 0.72) + 'px');
  for (const c of ring2.children) {
    c.style.setProperty('--r', r2 + 'px');
    c.style.width = cw2 + 'px';
    c.style.height = ch2 + 'px';
    c.style.left = (-cw2/2) + 'px';
    c.style.top = (-ch2/2) + 'px';
  }
}

let rot = 0, vel = 0, dragging = false, lastX = 0, downX = 0, moved = false, targetIndex = 0, settled = true, lastRot = NaN;
let lastFrontSlot = -1, lastCard = -1;

const applyRot = () => {
  if (rot !== lastRot) {
    ring.style.setProperty('--rot', rot+'deg');
    ring2.style.setProperty('--rot', rot+'deg');
    lastRot = rot;
  }
};
const frontSlot = () => ((Math.round(-rot / stepDeg()) % CFG.slots) + CFG.slots) % CFG.slots;
const nearestCenter = () => Math.round(-rot / stepDeg());

function go(delta) { targetIndex = nearestCenter() + delta; settled = true; vel = 0 }
function focusSlot(slot) {
  const cs = nearestCenter(); let d = ((slot - (cs % CFG.slots)) % CFG.slots + CFG.slots) % CFG.slots;
  if (d > CFG.slots / 2) d -= CFG.slots;
  targetIndex = cs + d; settled = true; vel = 0;
}
function focusWork(i) {
  const cs = nearestCenter(); let d = ((i - (cs % CARDS.length)) % CARDS.length + CARDS.length) % CARDS.length;
  if (d > CARDS.length / 2) d -= CARDS.length;
  targetIndex = cs + d; settled = true; vel = 0;
}

function render() {
  const fs = frontSlot();
  if (fs !== lastFrontSlot) {
    const old = ring.querySelector('.card.-front');
    if (old) old.classList.remove('-front');
    const neu = ring.querySelector(`.card[data-slot="${fs}"]`);
    if (neu) neu.classList.add('-front');
    lastFrontSlot = fs;
  }
  const ci = fs % CARDS.length;
  if (ci !== lastCard) {
    const cd = CARDS[ci];
    document.getElementById('d-title').textContent = cd.title;
    document.getElementById('d-meta').textContent = cd.meta;
    const tag = document.getElementById('d-tag');
    tag.textContent = cd.tag;
    tag.classList.toggle('-diy', /DIY/i.test(cd.tag));
    document.getElementById('d-cur').textContent = toRoman(ci+1);
    ghost.textContent = toRoman(ci+1);
    [...dotsEl.children].forEach((b, i) => b.classList.toggle('-on', i === ci));
    lastCard = ci;
  }
}

stage.addEventListener('pointerdown', e => {
  dragging = true; lastX = downX = e.clientX; moved = false; vel = 0; settled = false;
  stage.classList.add('-drag');
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX; lastX = e.clientX;
  if (Math.abs(e.clientX - downX) > 6) moved = true;
  const d = -dx * CFG.drag; rot += d; vel = d;
});
stage.addEventListener('pointerup', e => {
  dragging = false; settled = false; stage.classList.remove('-drag');
  if (!moved) {
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const card = el && el.closest('#ring .card');
    if (card) focusSlot(+card.dataset.slot);
  }
});
stage.addEventListener('pointercancel', () => { dragging = false; stage.classList.remove('-drag'); });
stage.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); go(-1); }
});
document.getElementById('next').addEventListener('click', () => go(1));
document.getElementById('prev').addEventListener('click', () => go(-1));

function tick() {
  if (!dragging) {
    rot += vel; vel *= CFG.damp;
    if (CFG.autoSpin > 0) { rot += CFG.autoSpin; }
    else if (Math.abs(vel) < 0.05) {
      if (!settled) { targetIndex = nearestCenter(); settled = true; }
      const diff = -targetIndex * stepDeg() - rot;
      if (Math.abs(diff) < 0.01) rot = -targetIndex * stepDeg();
      else rot += diff * (REDUCE ? 1 : 0.14);
    } else settled = false;
  }
  applyRot(); render();
  requestAnimationFrame(tick);
}

(function dust() {
  const canvas = document.getElementById('dust');
  const ctx = canvas.getContext('2d');
  let w, h, parts;
  function resize() {
    w = canvas.width = innerWidth * devicePixelRatio;
    h = canvas.height = innerHeight * devicePixelRatio;
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    const n = Math.min(48, Math.floor(innerWidth / 28));
    parts = Array.from({length: n}, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: (0.6 + Math.random() * 1.8) * devicePixelRatio,
      vx: (-0.15 + Math.random() * 0.3) * devicePixelRatio,
      vy: (-0.25 - Math.random() * 0.35) * devicePixelRatio,
      a: 0.08 + Math.random() * 0.18,
    }));
  }
  function frame() {
    if (REDUCE) return;
    ctx.clearRect(0, 0, w, h);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy;
      if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
      if (p.x < -10) p.x = w + 10;
      if (p.x > w + 10) p.x = -10;
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,236,200,${p.a})`;
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  resize(); window.addEventListener('resize', resize);
  if (!REDUCE) frame();
})();

buildRing(); buildDots(); layout(); applyStyles(); applyRot(); render(); tick();
window.addEventListener('resize', layout);
stage.focus({ preventScroll: true });
</script>
